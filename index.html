<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My AI Website</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; border-radius: 6px; padding: 8px; }
    button { padding: 10px 20px; cursor: pointer; border-radius: 6px; border: none; background: #0070f3; color: white; }
    #output { margin-top: 15px; padding: 12px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h3>Ask AI</h3>
  <textarea id="userInput" placeholder="Type something..."></textarea>
  <button onclick="askAI()">Send</button>

  <div id="output">AI response will appear here...</div>

  <script>
    async function askAI() {
      const text = document.getElementById("userInput").value;
      const output = document.getElementById("output");

      if (!text) return alert("Type a message first!");

      output.innerText = "Thinking...";

      try {
        const response = await fetch("YOUR_WORKER_URL_HERE", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No reply received.";
        output.innerText = reply;
      } catch (err) {
        output.innerText = "Error connecting to AI.";
      }
    }
  </script>

</body>
</html>
